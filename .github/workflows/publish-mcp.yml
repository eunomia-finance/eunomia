name: Publish eunomia-mcp

# A tag `mcp-v<version>` stages packages/mcp on npm through trusted publishing (OIDC): no
# token is stored anywhere, and the release carries provenance linking the exact commit and
# workflow run that built it. Staged, not published: it goes public only when a maintainer
# approves it with 2FA (npmjs.com → eunomia-mcp → Staged Packages, or `npm stage approve`).
# The trusted publisher on npmjs.com (eunomia-mcp → Settings) allows staging only, so a
# leaked workflow cannot ship a release on its own.
on:
  push:
    tags: ["mcp-v*"]

permissions:
  contents: read
  id-token: write # OIDC: trusted publishing and the provenance signature

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/mcp
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Staged publishing needs npm 11.15 or newer (and Node 22.14). Named exactly: the tool
      # that builds and signs a release is not left to whatever is newest that day.
      - run: npm install -g npm@11.21.1
      - name: Tag matches package version
        run: |
          want="mcp-v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$want" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json ($want)"; exit 1
          fi
      # npm ci installs exactly what npm-shrinkwrap.json names and fails if package.json has
      # drifted from it. The shrinkwrap is published with the package, so the tree tested here
      # is the tree an agent's machine installs.
      - run: npm ci
      # The binding and codec sync checks, the tests and the build, run here rather than left
      # to prepublishOnly.
      - run: npm run prepublishOnly
      # Provenance is added by npm itself for an OIDC publish from a public repository.
      - run: npm stage publish --access public
