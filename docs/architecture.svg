<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 880" width="1400" height="880" role="img" aria-labelledby="t d">
  <title id="t">Eunomia — architecture</title>
  <desc id="d">An owner, signing once through the treasury factory, creates a bounded Soroban treasury with its rules, payees and an agent Leash. Turkish lira reaches the treasury as USDC through a SEP-6 anchor and a funding account. The AI agent, connected with eunomia-mcp, signs pay() with its Leash key; the contract pays approved payees and refuses everyone else. A reputation registry can admit payees, and a zero-knowledge verifier attests that a period's payments stayed inside policy.</desc>
  <defs>
    <style>
      .mono { font-family: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace; }
      .sans { font-family: system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
      .ink { fill: #223E05; } .ink2 { fill: #55693F; } .cream { fill: #FCFFD5; } .cream2 { fill: #FCFFD5; fill-opacity: .68; } .red { fill: #A62021; }
      .h { font-size: 14px; font-weight: 700; letter-spacing: .04em; }
      .b { font-size: 11.5px; } .s { font-size: 11px; } .eb { font-size: 11px; letter-spacing: .26em; }
      .panel { fill: #F4FADC; stroke: #223E05; stroke-opacity: .2; }
      .line { stroke: #223E05; stroke-width: 1.5; fill: none; }
      .soft { stroke: #55693F; stroke-width: 1.3; fill: none; stroke-dasharray: 4 5; }
      .no { stroke: #A62021; stroke-width: 1.5; fill: none; stroke-dasharray: 6 5; }
    </style>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#223E05"/></marker>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#55693F"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#A62021"/></marker>
  </defs>

  <rect x=".5" y=".5" width="1399" height="879" rx="22" fill="#FCFFD5" stroke="#223E05" stroke-opacity=".2"/>

  <!-- header -->
  <text x="56" y="68" class="sans ink" font-size="30">Eunomia <tspan class="ink2" font-size="24">— architecture</tspan></text>
  <text x="56" y="98" class="mono ink2 eb">THE SAFETY LAYER FOR AGENT MONEY · STELLAR</text>
  <text x="1344" y="68" text-anchor="end" class="mono ink2 b">non-custodial · every rule on-chain</text>

  <!-- fiat rail: bank -> anchor -> funding account -> treasury -->
  <rect class="panel" x="56" y="136" width="250" height="76" rx="14"/>
  <text x="80" y="168" class="mono ink h">BANK ACCOUNT</text>
  <text x="80" y="192" class="mono ink2 b">TRY · an ordinary transfer</text>

  <rect class="panel" x="376" y="136" width="290" height="76" rx="14"/>
  <text x="400" y="168" class="mono ink h">SEP-6 ANCHOR</text>
  <text x="400" y="192" class="mono ink2 b">SEP-1 · 10 · 38 · 6 · rate locked</text>

  <rect class="panel" x="736" y="136" width="290" height="76" rx="14"/>
  <text x="760" y="168" class="mono ink h">FUNDING ACCOUNT</text>
  <text x="760" y="192" class="mono ink2 b">device-held G… key · a corridor</text>

  <path class="line" marker-end="url(#a)" d="M306 174H374"/>
  <text x="340" y="162" text-anchor="middle" class="mono ink2 s">TRY</text>
  <path class="line" marker-end="url(#a)" d="M666 174H734"/>
  <text x="700" y="162" text-anchor="middle" class="mono ink2 s">USDC</text>
  <path class="line" marker-end="url(#a)" d="M881 212V294"/>
  <text x="897" y="250" class="mono ink2 s">forwards the USDC ·</text>
  <text x="897" y="266" class="mono ink2 s">no wallet prompt</text>

  <!-- owner -> factory -> treasury -->
  <rect class="panel" x="56" y="296" width="290" height="110" rx="14"/>
  <text x="80" y="330" class="mono ink h">OWNER</text>
  <text x="80" y="356" class="mono ink b">passkey or wallet · root of trust</text>
  <text x="80" y="380" class="mono ink2 b">pause · withdraw · revoke, any time</text>

  <path class="line" marker-end="url(#a)" d="M346 351H498"/>
  <rect x="357" y="329" width="130" height="44" rx="22" fill="#FCFFD5" stroke="#223E05" stroke-width="1.5"/>
  <text x="422" y="347" text-anchor="middle" class="mono ink s" font-weight="700" letter-spacing=".08em">FACTORY</text>
  <text x="422" y="363" text-anchor="middle" class="mono ink2 s">one signature</text>
  <text x="422" y="316" text-anchor="middle" class="mono ink2 s">rules · payees · Leash</text>

  <!-- the one dark panel: the treasury -->
  <rect x="500" y="296" width="420" height="276" rx="16" fill="#223E05"/>
  <text x="532" y="334" class="mono cream" font-size="15" font-weight="700" letter-spacing=".04em">BOUNDED TREASURY</text>
  <text x="532" y="358" class="mono cream2 b">Soroban contract · funds live here · USDC or XLM</text>
  <path d="M532 376H888" stroke="#FCFFD5" stroke-opacity=".2"/>
  <g class="mono cream" font-size="13">
    <rect x="532" y="396" width="7" height="7" rx="1.5" fill="#A2CB28"/><text x="550" y="404">payee ∈ whitelist  or  reputation ≥ θ</text>
    <rect x="532" y="424" width="7" height="7" rx="1.5" fill="#A2CB28"/><text x="550" y="432">per-payment cap · rolling 24h cap</text>
    <rect x="532" y="452" width="7" height="7" rx="1.5" fill="#A2CB28"/><text x="550" y="460">Leash spent ≤ session cap · not expired</text>
    <rect x="532" y="480" width="7" height="7" rx="1.5" fill="#A2CB28"/><text x="550" y="488">paused? owner-only lifecycle</text>
  </g>
  <text x="532" y="540" class="mono cream" font-size="13" font-weight="700">the contract decides — not the model</text>

  <!-- owner -> leash -> agent -->
  <path class="line" marker-end="url(#a)" d="M201 406V604"/>
  <rect x="96" y="482" width="210" height="46" rx="12" fill="#FCFFD5" stroke="#223E05" stroke-width="1.5"/>
  <rect x="112" y="492" width="7" height="7" rx="1.5" fill="#A2CB28"/>
  <text x="127" y="500" class="mono ink s" font-weight="700" letter-spacing=".08em">LEASH</text>
  <text x="112" y="518" class="mono ink2 s">session key · deadline · cap</text>

  <rect class="panel" x="56" y="606" width="290" height="110" rx="14"/>
  <text x="80" y="640" class="mono ink h">AI AGENT</text>
  <text x="80" y="666" class="mono ink b">any MCP client · eunomia-mcp</text>
  <text x="80" y="690" class="mono ink2 b">asks to pay — never holds funds</text>

  <path class="line" marker-end="url(#a)" d="M346 640 498 534"/>
  <text x="362" y="668" class="mono ink s">pay(task, to, amount) · signed with the Leash</text>
  <text x="362" y="686" class="mono ink2 s">x402: a 402 quote settles the same way</text>

  <!-- right column -->
  <rect class="panel" x="1074" y="296" width="270" height="96" rx="14"/>
  <text x="1098" y="330" class="mono ink h">PAYEE</text>
  <text x="1098" y="354" class="mono ink b">whitelisted / earned trust</text>
  <text x="1098" y="374" class="mono ink2 b">paid in the treasury's token</text>
  <path class="line" marker-end="url(#a)" d="M920 344H1072"/>
  <rect x="958" y="322" width="7" height="7" rx="1.5" fill="#A2CB28"/>
  <text x="972" y="330" class="mono ink s">in policy</text>

  <rect x="1074" y="426" width="270" height="96" rx="14" fill="#FCFFD5" stroke="#A62021" stroke-width="1.3" stroke-dasharray="6 5"/>
  <text x="1098" y="460" class="mono red h">UNKNOWN WALLET</text>
  <text x="1098" y="484" class="mono ink b">prompt-injected drain attempt</text>
  <text x="1098" y="504" class="mono red b">PayeeNotWhitelisted · 0 moved</text>
  <path class="no" marker-end="url(#ar)" d="M920 474H1072"/>
  <text x="958" y="460" class="mono red s">✕ refused</text>

  <rect class="panel" x="1074" y="586" width="270" height="96" rx="14"/>
  <text x="1098" y="620" class="mono ink h">ERC-8004 REGISTRY</text>
  <text x="1098" y="644" class="mono ink b">agent identity · reputation</text>
  <text x="1098" y="664" class="mono ink2 b">an open standard, on Stellar</text>
  <path class="soft" marker-end="url(#a2)" d="M1072 630 922 548"/>
  <text x="950" y="618" class="mono ink2 s">feeds the</text>
  <text x="950" y="634" class="mono ink2 s">reputation gate</text>

  <!-- zk verifier -->
  <path class="soft" marker-end="url(#a2)" d="M710 572V704"/>
  <text x="726" y="642" class="mono ink2 s">zero-knowledge proof</text>
  <rect class="panel" x="500" y="706" width="420" height="116" rx="14"/>
  <text x="532" y="740" class="mono ink h">ZK VERIFIER <tspan class="ink2" font-weight="400" font-size="11.5" letter-spacing="0">· Groth16 / BN254 · on-chain</tspan></text>
  <text x="532" y="766" class="mono ink b">proves a period's payments stayed inside policy —</text>
  <text x="532" y="784" class="mono ink b">amounts and payees stay sealed</text>
  <text x="532" y="806" class="mono ink2 b">→ emits a Sealed Receipt (attested)</text>

  <!-- footer -->
  <text x="56" y="850" class="mono ink2 s">A leash, not a wallet.</text>
  <text x="1344" y="850" text-anchor="end" class="mono ink2 s">github.com/eunomia-finance/eunomia</text>
</svg>
