<html lang="en">
  <head>

         downscale rather than shipped as its own file. -->

    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <meta name="theme-color" content="#1F3A2E" />

    <!-- Open Graph / social share -->
    <meta property="og:type" content="website" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://api.fontshare.com" />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <!-- Landing identity: Questrial for headings, Geist for body. Kept separate from the
         dashboard's Inter/Fraunces so the two surfaces can migrate independently.
         Kalnia is the brand signature only — the wordmark and the opening curtain. A single
         weight is requested on purpose: it never sets a heading or a paragraph. -->
    <link href="https://fonts.googleapis.com/css2?family=Questrial&family=Geist:wght@300;400;500;600;700&family=Kalnia:wght@500&display=swap" rel="stylesheet" />
    <title>Eunomia — bounded agent treasury on Stellar</title>
    <!-- Theme is applied before first paint, and for the whole document rather than just the
         landing: useTheme only runs while the landing is mounted, so a dark preference was
         dropped the moment someone opened the app shell (or reloaded inside it). Reading it
         here also avoids a flash of the wrong palette. -->
    <script>
      try {
        var t = localStorage.getItem("eunomia-theme");
        /* Light is the brand default for every first visit — the OS preference is not
           consulted, only an explicit in-app choice overrides it. */
        if (t !== "dark" && t !== "light") t = "light";
        document.documentElement.setAttribute("data-theme", t);
      } catch (e) { /* private mode: the light default stands */ }
      /* Which page is about to open: the landing page is dark, the app follows the theme.
         The splash below takes its colours from this, so neither opens on the other's. */
      document.documentElement.setAttribute(
        "data-boot",
        /^#(overview|payments|agent|activity|settings|wallet|workspace|dashboard)$/.test(location.hash) ? "app" : "landing"
      );
    </script>
    <style>
      html,body{background:#08080b}
      /* pre-hydration splash — painted instantly, replaced when React mounts.
         150ms fade-in delay keeps it invisible on fast loads.
         The colour lives on .boot rather than on body, and follows the page that is opening
         (data-boot, set above): forest for the landing page, the theme's ground for the app.
         .boot covers the viewport, so nothing behind it is ever seen. */
      .boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
            background:#0c1712;color:#F4EFE6;font-family:'Kalnia',Georgia,'Times New Roman',serif}
      [data-boot="app"] .boot{background:#F4EFE6;color:#16291F}
      [data-boot="app"][data-theme="dark"] .boot{background:#16291F;color:#F4EFE6}
      .boot__m{display:flex;align-items:center;gap:11px;font-size:24px;opacity:0;animation:bootin .5s ease .15s forwards}
      /* The mark itself, not a generic dot — the same shape the nav carries (the small-size
         drawing of lib/mark.ts, written out). The payment on its line is the part that pulses. */
      .boot__mk{width:66px;height:30px;display:block;flex:none}
      .boot__pay{animation:bootpulse 1.6s ease-in-out .15s infinite}
      @keyframes bootin{to{opacity:1}}
      @keyframes bootpulse{0%,100%{opacity:1}50%{opacity:.35}}
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot"><div class="boot__m">
        <svg class="boot__mk" viewBox="4 0 220 100" fill="currentColor" aria-hidden="true">
          <path d="M57.7 18A24 21 0 1 0 42.2 50.7L45.1 47.2A18 17.5 0 1 1 56.7 20ZM41.7 50.3A27 21 0 1 0 58.3 83.9L57.7 81.8A20.5 17.5 0 1 1 45.1 53.8ZM40.6 50.5L45.1 47.2Q58 47.9 78 48.2L78 52.8Q58 53.1 45.1 53.8ZM77.5 48.2H136.3V52.8H77.5ZM160 12.221A42.3 42.3 0 0 0 160 88.779ZM160 12.221A42.3 42.3 0 1 1 160 88.779L160 83.625A37.7 37.7 0 1 0 160 17.375ZM157.7 3h4.6v95h-4.6Z"/>
          <circle cx="55.8" cy="21.9" r="4.8"/><circle cx="56.2" cy="80.2" r="4.8"/>
          <circle class="boot__pay" cx="106" cy="50.5" r="9.5"/>
        </svg>Eunomia
      </div></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- Cloudflare Web Analytics: cookieless page views; the token is public by design -->
    <script type="module" src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token": "76b4ab911fa44d26bee3e3db956783e5"}'></script>
  </body>
</html>
